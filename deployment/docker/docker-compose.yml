version: '3.8'

services:
  node1:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    container_name: raftline-node1
    command: >
      --id=node1
      --http-port=8000
      --grpc-port=9000
      --data-dir=/data
      --peers=node2=node2:9000:8000,node3=node3:9000:8000,node4=node4:9000:8000,node5=node5:9000:8000
    ports:
      - "8001:8000"
    volumes:
      - node1-data:/data
    networks:
      - raft-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8000/v1/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s

  node2:
