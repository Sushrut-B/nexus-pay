# Default values for raftline Helm Chart

replicaCount: 5

image:
  repository: raftline/raftline
  pullPolicy: IfNotPresent
  tag: "1.0.0"

service:
  type: ClusterIP
  httpPort: 8000
  grpcPort: 9000

security:
  apiKey: "secret-raftline-cluster-token-2026"

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 250m
    memory: 512Mi

probes:
  liveness:
    path: /v1/health/live
    initialDelaySeconds: 5
    periodSeconds: 5
  readiness:
    path: /v1/health/ready
    initialDelaySeconds: 10
    periodSeconds: 5

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 10s
    path: /v1/metrics
