apiVersion: v1
kind: Service
metadata:
  name: {{ include "raftline.fullname" . }}-headless
  labels:
    {{- include "raftline.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - port: {{ .Values.service.grpcPort }}
      name: grpc
      targetPort: grpc
    - port: {{ .Values.service.httpPort }}
      name: http
      targetPort: http
  selector:
    {{- include "raftline.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "raftline.fullname" . }}
  labels:
    {{- include "raftline.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "raftline.selectorLabels" . | nindent 4 }}
